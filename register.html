<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Business | BizConnect</title><link rel="stylesheet" href="style.css"></head>
<body><header><nav class="navbar"><a class="logo" href="index.html">Biz<span>Connect</span></a>
<div class="nav-links"><a href="index.html">Home</a><a href="businesses.html">Businesses</a><a href="services.html">Services</a><a class="active" href="register.html">Register</a><a href="checkout.html">🛒 Cart <span id="cartCount">0</span></a></div></nav></header>
<section class="page-banner"><h1>Register Your Business</h1><p>Showcase your business to potential customers.</p></section>
<section class="section"><div class="form-box"><h2>Business Registration</h2>
<form onsubmit="registerBusiness(event)">
<label>Business Name</label><input id="businessName" required placeholder="Enter business name">
<label>Owner Name</label><input id="ownerName" required placeholder="Enter owner name">
<label>Business Category</label><select id="businessCategory" required><option value="">Select category</option><option>Fashion</option><option>Food</option><option>Beauty</option><option>Repair</option><option>Plants</option><option>Education</option><option>Other</option></select>
<label>Phone Number</label><input id="businessPhone" type="tel" pattern="[0-9]{10}" required placeholder="10-digit phone number">
<label>Location</label><input id="businessLocation" required placeholder="City / Area">
<label>Products or Services</label><textarea id="businessDescription" rows="5" required placeholder="Describe your products or services"></textarea>
<button class="btn" type="submit">Submit Business</button></form><div id="registerSuccess" class="success-box" hidden></div></div></section>
<footer><p>© 2026 BizConnect. Grow your business with us.</p></footer><script src="script.js"></script></body></html>
